name: Delete Merged Branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    steps:
      # PINNED TO A COMMIT RATHER THAN A TAG, AND THIS IS THE WORKFLOW WHERE
      # THAT MATTERS MOST.
      #
      # This step was the one `uses:` in `.github/workflows/**` still naming a
      # mutable tag (`actions/checkout@v4`); every other one already named a
      # 40-character sha. It sits on the only workflow here granted
      # `contents: write` whose checkout keeps its credential and whose later
      # steps run `git push origin --delete` over the branch list in
      # `deletebranches.sh`. A tag is a pointer somebody else can move, so with
      # `@v4` the answer to "what code runs with that token" was "whatever
      # actions/checkout's v4 tag points at when a maintainer dispatches this".
      # A single unpinned entry among pinned ones is worse than none pinned at
      # all: a reviewer who reads the others takes the discipline as settled and
      # does not look.
      #
      # Two facts that bound the finding rather than dissolve it, stated because
      # a comment that only argues one way is not evidence. This workflow is
      # `workflow_dispatch` only, so nothing but a person with repository access
      # ever starts it; and the attacker the tag admits is whoever can move a
      # tag in actions/checkout, which is not a threat this repository can do
      # anything about except stop depending on it. Neither is a reason to keep
      # the tag, because pinning costs nothing and the property is now
      # mechanical: tests/foundation/ci-configuration-contract.test.ts requires
      # a 40-character sha of every `uses:` in this directory, so a workflow
      # added later cannot reintroduce the gap quietly.
      #
      # WHY THE v6 SHA AND NOT A v4 ONE. The two are the same interface. Diffing
      # actions/checkout's action.yml at the v4 tag against the same file at the
      # commit pinned below gives exactly one changed line -- `using: node20`
      # becomes `using: node24` -- and every input this step passes
      # (`persist-credentials`, `fetch-depth`) keeps its name, its meaning and
      # its default. So the choice was between two spellings of one interface,
      # and v6 is the spelling this repository already runs: it is the sha every
      # other checkout here already names, and one of those (version.yml) keeps
      # its credential and pushes a branch and a tag exactly as this one does,
      # and has done so for every release commit on `main`. The
      # alternative would have been to write a 40-character id for a v4 commit,
      # and an id nobody in the change verified is not a pin.
      #
      # WHAT CHANGES ON THE RUNNER. v6 asks the Actions runner for the node24
      # handler where v4 asked for node20. On `[self-hosted, Linux, X64, wsl2]`
      # that is measured: every other call site here runs it, and every run in
      # this repository that has ever succeeded ran on that label.
      #
      # AND WHAT THIS DOES NOT FIX -- READ THIS BEFORE TRUSTING THE JOB ABOVE.
      # `runs-on:` here is `ubuntu-latest`, and nothing about `ubuntu-latest` is
      # measurable in this repository, because THIS WORKFLOW HAS NEVER
      # SUCCEEDED. It has run once, and failed after four seconds with no step
      # recorded and no log, which is the signature of a runner that was never
      # provisioned. version.yml's first run failed identically in the same four
      # seconds and was moved to the self-hosted label at `adb6b01`, whose
      # message records the measurement and whose header section "Which runner,
      # and why the obvious answer was wrong" carries the argument; version.yml
      # names this workflow in that section as the precedent it had wrongly
      # relied on.
      #
      # So the state of this job is: pinned, explicit about its credential, and
      # still not runnable as written. That is recorded here rather than fixed
      # in passing, because moving a workflow that runs `git push origin
      # --delete` onto a runner that will actually execute it is a decision
      # about deleting branches, not a decision about pinning an action -- and
      # `deletebranches.sh` carries a hard-coded branch list from 2026-08-23
      # under `set -e`, so the first real run needs that list checked as well as
      # the label. It deserves its own change and its own reasoning.
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # THE SECOND CHECKOUT IN THIS REPOSITORY THAT KEEPS THE TOKEN, and
          # until this line the only one that did not say so.
          # `persist-credentials` defaults to `true` in v4 and in v6 alike, so
          # this step has always kept its credential -- by inheritance, which is
          # the one way a setting that decides whether a token survives into a
          # shell script should not be decided. `bash deletebranches.sh` below
          # runs `git push origin --delete`, so the credential has to survive
          # the checkout and `true` is deliberate. It is written out for the
          # reason version.yml writes out its own: an exception that is
          # inherited is invisible in the diff that would remove it, and
          # tests/foundation/ci-configuration-contract.test.ts can only require
          # `false` of every other checkout if the two that need `true` state
          # it.
          persist-credentials: true
          # Full history: "Verify branches to delete" below reads
          # `git branch -r --merged origin/main`, and at the action's default
          # depth of 1 that comparison has nothing to walk.
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch branches
        run: git fetch --prune

      - name: Verify branches to delete
        run: |
          echo "Branches that will be deleted:"
          git branch -r --merged origin/main | grep -E "(claude|codex|foundation)" || echo "No branches found"

      - name: Run delete script
        run: bash deletebranches.sh

      - name: Verify deletion
        run: |
          echo "Remaining branches with claude/codex/foundation:"
          git fetch --prune
          git branch -r | grep -E "(claude|codex|foundation)" | wc -l
