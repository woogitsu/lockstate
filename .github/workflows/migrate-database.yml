name: Database migrations

# DELIBERATELY MANUAL, AND DELIBERATELY SEPARATE FROM deploy.yml.
#
# `supabase db push` applies migrations to a live project and is not
# reversible, and rollback is not automated. Attaching it to a merge means any
# pull request can alter a database as a side effect of being merged. This
# workflow therefore runs only when a human starts it, only through a GitHub
# Environment, and only after typing the project ref back as confirmation.
#
# THAT IS NO LONGER THE ONLY PATH, AND THIS IS NOT THE ONE THAT USUALLY RUNS.
# Since 2026-08-23 a merge to `main` applies pending migrations to the hosted
# *staging* project, through Supabase's own GitHub integration -- configured
# in Supabase's dashboard, invisible from this repository, and triggered by
# the merge rather than by anything under supabase/migrations/ having changed.
# See docs/DEPLOYMENT.md, "Automated deployment", for the observed evidence.
#
# So this workflow is not the staging path any more; it is two other things.
# It is the ONLY path to a production project -- the integration has one
# target and must never be repointed at production (ADR 0016 §2, Proposed) --
# and its dry-run mode is the only way to inspect what a hosted project
# actually has applied without changing anything. It also remains a recovery
# path for staging: `supabase db push` skips already-applied migrations, so
# the two mechanisms reaching the same project is idempotent.
#
# The schema in supabase/migrations/ has been executed against a local
# PostgreSQL, against the local Supabase stack, and -- since 2026-08-23 --
# against the hosted staging project, where all nine migrations
# (20260822190000 through 20260823100000) are applied. Target a disposable
# project first.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which Supabase project to migrate
        type: choice
        options: [staging, production]
        default: staging
      confirm_project_ref:
        description: Type the target project ref exactly, to confirm
        required: true
        type: string
      dry_run:
        description: Only show what would be applied, change nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: migrate-${{ inputs.target }}
  cancel-in-progress: false # never interrupt a migration mid-apply

env:
  CI: true
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  migrate:
    runs-on: [self-hosted, Linux, X64, wsl2]
    timeout-minutes: 30
    environment:
      name: ${{ inputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Verify the SQL against a local PostgreSQL BEFORE anything reaches a
      # hosted project -- before the CLI is even provisioned, so a broken
      # migration set stops here rather than after `supabase link`.
      #
      # The asymmetry this closes: deploy.yml re-runs the whole gate before a
      # Worker deploy, which `wrangler rollback` can undo. This workflow ran no
      # verification at all before `supabase db push`, which cannot be undone --
      # docs/DEPLOYMENT.md states that rollback of a migration is not
      # automated. The irreversible operation was the unguarded one.
      #
      # `verify:sql` is the only thing in this repository that executes the SQL
      # under supabase/: it applies all nine migrations in order and runs the
      # pgTAP suite. It found three real defects the first time it was run
      # (docs/CLOUD_SAVE.md). It runs for a dry run too -- a dry run whose SQL
      # does not apply locally is worth failing.
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable && corepack prepare pnpm@11.22.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision PostgreSQL and pgTAP
        run: bash scripts/provision-postgres.sh

      - name: Verify the migrations apply and pass pgTAP locally
        run: pnpm verify:sql

      - name: Provision the Supabase CLI
        run: bash scripts/provision-supabase-cli.sh

      # The typed confirmation is compared against the secret, so a mistyped or
      # copy-pasted-from-the-wrong-tab ref stops here rather than at the point
      # of no return. It is compared without printing either value.
      - name: Confirm the operator meant this project
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CONFIRMED: ${{ inputs.confirm_project_ref }}
        run: |
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not set for the '${{ inputs.target }}' environment. See docs/DEPLOYMENT.md."
            exit 1
          fi
          if [ "$CONFIRMED" != "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::The confirmation you typed does not match the project ref configured for '${{ inputs.target }}'. Nothing was applied."
            exit 1
          fi
          echo "Confirmation matches the configured project ref."

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show what would be applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list

      - name: Apply migrations
        if: ${{ inputs.dry_run == false }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Report that nothing was applied
        if: ${{ inputs.dry_run == true }}
        run: echo "::notice::Dry run — the list above is what a real run would apply. Re-run with dry_run unchecked to apply it."
