name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, wsl2]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.22.0 --activate

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(pnpm --version)" = "11.22.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Provisioned here, not in the `assets` job that needs it: `actions/checkout`
      # is the first step of its own job, so a job cannot install the binary its
      # own `lfs: true` checkout requires. `assets` therefore `needs: verify`,
      # and a runner rebuilt from scratch heals itself on the first run.
      - name: Provision Git LFS
        run: bash scripts/provision-git-lfs.sh

      - name: Verify project
        run: pnpm verify

      - name: Verify benchmark harness
        run: pnpm verify:benchmark

      - name: Verify Cloudflare deployment packages
        run: pnpm verify:deployment

      # The pgTAP suite is the only thing in this repository that executes
      # the SQL under supabase/. It was skipped through issues #20 and #36
      # and, when finally run, found three real defects (docs/CLOUD_SAVE.md).
      # Provisioning is a repository-owned script rather than a service
      # container: verify:sql shells out to a local psql, no published
      # Postgres image ships pgTAP, and the whole point of this check is that
      # it survives an environment where container images cannot be pulled.
      - name: Provision PostgreSQL and pgTAP
        run: bash scripts/provision-postgres.sh

      - name: Verify Supabase SQL (migrations + pgTAP)
        run: pnpm verify:sql

      - name: Verify generated output did not modify tracked files
        run: test -z "$(git status --porcelain)"

  # Issue #32 requires that missing, inconsistent or oversized assets fail
  # validation before build/release. `tooling/validate-runtime-atlas.mjs` reads
  # the PNGs themselves, and `.gitattributes` routes every one of them through
  # Git LFS, so this is the one job that needs LFS content.
  #
  # It is a separate job on purpose. LFS bandwidth is metered and this repository
  # will keep growing, so the `verify` job above stays on a pointer-only checkout
  # and never pays for it. That also keeps a pointer-only run honest rather than
  # vacuous: the validator recognises a pointer file and fails with that message
  # instead of treating it as valid art.
  #
  # Separate does not mean optional -- same precedent as `verify:sql`
  # (docs/TESTING.md), which found three real defects the first time it was run.
  assets:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # `verify` provisions git-lfs. `actions/checkout` is the first step of its
    # own job, so this job cannot install the binary its `lfs: true` checkout
    # depends on; depending on `verify` is what makes a from-scratch runner heal
    # itself instead of failing with "Unable to locate executable file: git-lfs".
    # It also means this job never spends LFS bandwidth on a build that is
    # already failing.
    needs: verify
    runs-on: [self-hosted, Linux, X64, wsl2]
    timeout-minutes: 20
    steps:
      - name: Checkout with LFS art
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          lfs: true

      # A green run must mean the validator saw pixels. `pnpm verify:assets`
      # already refuses a pointer file, but this asserts it up front and prints
      # the evidence, so the log answers "did LFS actually materialise?" without
      # anyone having to trust that the later step would have caught it. A job
      # that silently validates 3-line text stubs is worse than no job, because
      # it manufactures confidence.
      - name: Confirm the runtime art is image data, not LFS pointers
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          total=0
          for file in public/assets/actors/*.png; do
            count=$((count + 1))
            if head -c 64 "$file" | grep -q 'git-lfs.github.com'; then
              echo "::error::$file is still a Git LFS pointer; LFS content did not materialise"
              exit 1
            fi
            signature="$(head -c 8 "$file" | od -An -tx1 | tr -d ' \n')"
            if [ "$signature" != "89504e470d0a1a0a" ]; then
              echo "::error::$file does not start with the PNG signature (got $signature)"
              exit 1
            fi
            size="$(stat -c%s "$file")"
            # An LFS pointer is ~130 bytes. Any real atlas is orders of magnitude
            # larger; this is a floor, not a pinned size, so re-rendered art does
            # not have to update CI.
            if [ "$size" -lt 4096 ]; then
              echo "::error::$file is only $size bytes, too small to be a real atlas"
              exit 1
            fi
            total=$((total + size))
            printf '%10s bytes  %s\n' "$size" "$file"
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::no runtime atlases were found to validate"
            exit 1
          fi
          echo "OK: $count atlases, $total bytes of real image data"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.22.0 --activate

      # Uses no dependencies, so it deliberately runs without pnpm install.
      - name: Validate runtime atlases against the authored contract
        run: pnpm verify:assets
