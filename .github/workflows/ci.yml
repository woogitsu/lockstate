name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, never a run on `main`. For a push to `main` the
  # ref is constant, so `true` meant two merges landing close together
  # cancelled the earlier commit's CI -- while that commit was already live,
  # since a merge deploys. It left a shipped commit with no completed gate
  # result and nothing reporting the hole. A merge queue of one is worth the
  # extra minutes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, wsl2]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.22.0 --activate

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(pnpm --version)" = "11.22.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify project
        run: pnpm verify

      - name: Verify benchmark harness
        run: pnpm verify:benchmark

      - name: Verify Cloudflare deployment packages
        run: pnpm verify:deployment

      # The pgTAP suite is the only thing in this repository that executes
      # the SQL under supabase/. It was skipped through issues #20 and #36
      # and, when finally run, found three real defects (docs/CLOUD_SAVE.md).
      # Provisioning is a repository-owned script rather than a service
      # container: verify:sql shells out to a local psql, no published
      # Postgres image ships pgTAP, and the whole point of this check is that
      # it survives an environment where container images cannot be pulled.
      - name: Provision PostgreSQL and pgTAP
        run: bash scripts/provision-postgres.sh

      - name: Verify Supabase SQL (migrations + pgTAP)
        run: pnpm verify:sql

      - name: Verify generated output did not modify tracked files
        run: test -z "$(git status --porcelain)"

  # Issue #32 requires that missing, inconsistent or oversized assets fail
  # validation before build/release. `tooling/validate-runtime-atlas.mjs` reads
  # the PNGs themselves, and `.gitattributes` routes every one of them through
  # Git LFS, so this is the one job that needs LFS content.
  #
  # It is a separate job on purpose. LFS bandwidth is metered and this repository
  # will keep growing, so the `verify` job above stays on a pointer-only checkout
  # and never pays for it. That also keeps a pointer-only run honest rather than
  # vacuous: the validator recognises a pointer file and fails with that message
  # instead of treating it as valid art.
  #
  # Separate does not mean optional -- same precedent as `verify:sql`
  # (docs/TESTING.md), which found three real defects the first time it was run.
  assets:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Only so a failing build does not spend metered LFS bandwidth. Nothing in
    # this job depends on `verify` having provisioned anything.
    needs: verify
    runs-on: [self-hosted, Linux, X64, wsl2]
    timeout-minutes: 20
    steps:
      # Deliberately NOT `lfs: true`, for two measured reasons.
      #
      # 1. It does not work on a reused workspace. `actions/checkout` runs
      #    `git lfs fetch` and then relies on the following `git checkout` to
      #    smudge pointers into real files. This is a self-hosted runner, so the
      #    workspace is already at the target commit from the `verify` job; the
      #    checkout is a no-op, the smudge filter never runs, and the objects sit
      #    downloaded-but-unused while the working tree keeps 130-byte pointers.
      #    Observed in run 32637895668: LFS fetch succeeded, every atlas was
      #    still a pointer.
      # 2. It fetches every LFS object for the ref -- all 55 MB, including the
      #    source sheets this gate never reads.
      #
      # An explicit `git lfs pull` below fixes both: it materialises regardless
      # of whether the checkout moved anything, and it takes a path filter.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Provision Git LFS
        run: bash scripts/provision-git-lfs.sh

      # Only the runtime atlases (~17 MB), not the ~36 MB of source sheets under
      # public/game-content/ that this gate never opens.
      #
      # The credential is supplied for this command alone and removed on exit,
      # rather than by relaxing `persist-credentials` above: this is a private
      # repository so the transfer needs auth, but a self-hosted runner keeps its
      # workspace between jobs and a token left in .git/config would outlive this
      # one. This is the same config key `actions/checkout` sets for its own
      # `git lfs fetch`, which is why git-lfs honours it.
      - name: Fetch runtime art from Git LFS
        env:
          LFS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cleanup() {
            git config --local --unset-all 'http.https://github.com/.extraheader' 2>/dev/null || true
          }
          trap cleanup EXIT
          git config --local 'http.https://github.com/.extraheader' \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$LFS_TOKEN" | base64 -w0)"
          git lfs pull --include="public/assets/actors"

      # A green run must mean the validator saw pixels. `pnpm verify:assets`
      # already refuses a pointer file, but this asserts it up front and prints
      # the evidence, so the log answers "did LFS actually materialise?" without
      # anyone having to trust that the later step would have caught it. A job
      # that silently validates 3-line text stubs is worse than no job, because
      # it manufactures confidence.
      - name: Confirm the runtime art is image data, not LFS pointers
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          total=0
          for file in public/assets/actors/*.png; do
            count=$((count + 1))
            if head -c 64 "$file" | grep -q 'git-lfs.github.com'; then
              echo "::error::$file is still a Git LFS pointer; LFS content did not materialise"
              exit 1
            fi
            signature="$(head -c 8 "$file" | od -An -tx1 | tr -d ' \n')"
            if [ "$signature" != "89504e470d0a1a0a" ]; then
              echo "::error::$file does not start with the PNG signature (got $signature)"
              exit 1
            fi
            size="$(stat -c%s "$file")"
            # An LFS pointer is ~130 bytes. Any real atlas is orders of magnitude
            # larger; this is a floor, not a pinned size, so re-rendered art does
            # not have to update CI.
            if [ "$size" -lt 4096 ]; then
              echo "::error::$file is only $size bytes, too small to be a real atlas"
              exit 1
            fi
            total=$((total + size))
            printf '%10s bytes  %s\n' "$size" "$file"
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::no runtime atlases were found to validate"
            exit 1
          fi
          echo "OK: $count atlases, $total bytes of real image data"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.22.0 --activate

      # Uses no dependencies, so it deliberately runs without pnpm install.
      - name: Validate runtime atlases against the authored contract
        run: pnpm verify:assets

  # `tests/browser/` is the only layer in this repository that can settle
  # durability across a real page navigation, what a real browser's
  # `DOMException`s are actually named, behaviour under a genuinely exhausted
  # quota, and what a *computed* style, `elementFromPoint` or a decoded PNG
  # really is. It has earned its keep: a real adapter defect (#19,
  # docs/PERSISTENCE.md) and two real HUD layout defects that no unit test
  # could have found (docs/TESTING.md).
  #
  # And until this job it did not run in CI. `pnpm test:browser` was opt-in, so
  # the layer that keeps finding real defects only ran when a human remembered
  # to type it. That is the same failure as CI passing because someone had
  # installed something by hand, wearing a different costume.
  #
  # Separate job, not a merged step. docs/TESTING.md requires `pnpm test:browser`
  # to stay out of `pnpm test` and `pnpm verify`, and that separation is correct:
  # the ordinary suite must stay fast and browser-free. A required job is how the
  # check becomes non-optional without becoming part of them -- the same
  # precedent as `verify:sql` and `verify:assets`.
  browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Ordered after `assets` for two reasons, neither of them a data dependency.
    #
    # 1. A browser run is a couple of minutes on a single self-hosted runner.
    #    There is no point spending it on a tree that does not typecheck, test
    #    or build.
    # 2. `assets` has already materialised the runtime atlases into this
    #    workspace, so the `git lfs pull` below finds every object in the local
    #    LFS store and transfers nothing. The pull stays regardless: this job
    #    has to be correct on a cold workspace, not merely on the one `assets`
    #    happened to leave behind.
    needs: assets
    runs-on: [self-hosted, Linux, X64, wsl2]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # `app-shell.spec.ts` loads the real `index.html`, and the renderer asks a
      # real browser to decode every runtime atlas. A pointer-only checkout puts
      # a ~130-byte text stub behind a `200 image/png`, which is exactly the
      # failure that spec exists to catch -- so the art has to be real here for
      # the same reason it does in `assets`.
      #
      # Not asserted byte-by-byte again: `assets` already did that on this
      # workspace at this commit, and the spec's own failure names the file that
      # would not decode.
      - name: Provision Git LFS
        run: bash scripts/provision-git-lfs.sh

      # Same path filter and same scoped credential as the `assets` job; see the
      # comments there for why the token is set for this command alone.
      - name: Fetch runtime art from Git LFS
        env:
          LFS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cleanup() {
            git config --local --unset-all 'http.https://github.com/.extraheader' 2>/dev/null || true
          }
          trap cleanup EXIT
          git config --local 'http.https://github.com/.extraheader' \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$LFS_TOKEN" | base64 -w0)"
          git lfs pull --include="public/assets/actors"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.22.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright's browsers are not in the package and are not checked in, so
      # this runner has no Chromium unless something puts one there. The script
      # is idempotent and does no download when the browser is already on disk
      # and launches, which on this runner is every run after the first.
      #
      # It also carries the two things this host needs and a stock
      # `playwright install` does not: the fallback build for a distribution
      # release Playwright has no listing for, and an `ldd`-based check instead
      # of `--with-deps` (which needs root and, here, fails for the same
      # platform reason). See the script's header.
      - name: Provision Playwright's Chromium
        run: bash scripts/provision-playwright-browsers.sh

      # Headless: `tests/browser/playwright.config.ts` never sets
      # `headless: false`, so no display, xvfb or DISPLAY is involved.
      #
      # A FREE PORT, ASKED FOR RATHER THAN ASSUMED. This runner shares its host
      # with active development, so the suite's default 5183 is regularly taken
      # by a developer's harness server or by another checkout running the same
      # suite -- observed on the first run of this job, which died with
      # "127.0.0.1:5183 is already used". The suite deliberately refuses to
      # reuse a server it did not start, because attaching to one from a
      # different working tree means testing that tree's sources; so the fix is
      # a port nothing else holds, not a reuse flag.
      #
      # The suite must not be able to pass vacuously. `playwright test` already
      # fails when no test matches, and `forbidOnly` is on under CI; the second
      # guard adds the case neither covers -- a suite that ran but skipped its
      # way to green.
      - name: Run the real-browser suite
        run: |
          set -euo pipefail
          port="$(node -e 'const s = require("net").createServer(); s.listen(0, "127.0.0.1", () => { process.stdout.write(String(s.address().port)); s.close(); });')"
          echo "harness dev server port: $port"
          LOCKSTATE_BROWSER_TEST_PORT="$port" pnpm test:browser 2>&1 | tee browser-suite.log
          if ! grep -qE '[0-9]+ passed' browser-suite.log; then
            echo "::error::the browser suite reported no passing tests"
            exit 1
          fi
          if grep -qE '[0-9]+ (skipped|did not run)' browser-suite.log; then
            echo "::error::the browser suite skipped tests; running them is the entire point of this job"
            exit 1
          fi
