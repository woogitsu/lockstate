<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      The browser chrome's colour, one per scheme, because the page now has
      two themes (#1157). These are `--surface-base` in `src/ui/tokens.css`
      for each: the day background `#f2f6f8` and the night `#10232e`. A single
      value here would paint a dark address bar above a light interface on a
      light-preferring device, which is the same claim `color-scheme` in
      `tokens.css` keeps honest for scrollbars.

      `media` rather than a value written by the theme controller, because
      this has to be right before any script runs. A player who has chosen a
      theme against their device's preference gets the other one here for as
      long as first paint takes; nothing in this shell can read a storage key
      without shipping a script into the document head, which is a cost the
      address bar's colour does not justify.
    -->
    <meta name="theme-color" content="#f2f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10232e" media="(prefers-color-scheme: dark)" />
    <!--
      The product's name as a player sees it, spelled `LockState.io`: the
      owner's ruling of 2026-09-23 on #703 (AGENTS.md entry 15), the spelling
      `'brand.wordmark'` already carried. Both lines read `Lockstate.io` until
      then. Code identifiers, the package and the repository keep their own
      spelling; only what a player reads moved.
    -->
    <meta name="description" content="LockState.io — browser-first prison management simulation" />
    <title>LockState.io</title>
  </head>
  <body>
    <main id="app">
      <div id="game-root"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
