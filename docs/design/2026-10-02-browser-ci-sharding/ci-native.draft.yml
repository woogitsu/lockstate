        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Provision Git LFS
        run: bash scripts/provision-git-lfs.sh
      - name: Fetch runtime art from Git LFS
        env:
          LFS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cleanup() {
            git config --local --unset-all 'http.https://github.com/.extraheader' 2>/dev/null || true
          }
          trap cleanup EXIT
          git config --local 'http.https://github.com/.extraheader' \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$LFS_TOKEN" | base64 -w0)"
          git lfs pull --include="public/assets/actors,public/assets/environment/oblique/*.png"
          git lfs pull --include="public/game-content/source-art/floor.linoleum.institutional.*.png,public/game-content/source-art/wall.interior.modules.*.png,public/game-content/source-art/door.interior.variants.*.png,public/game-content/source-art/furniture.cell.bed.single.variants.*.png,public/game-content/source-art/rendered.door.interior.variants.*.png,public/game-content/source-art/rendered.door.interior.face.*.png,public/game-content/source-art/rendered.wall.interior.cap.overhead.*.png,public/game-content/source-art/rendered.wall.interior.face.*.png,public/game-content/source-art/rendered.floor.linoleum.institutional.*.png,public/game-content/source-art/rendered.terrain.dirt.compacted.*.png,public/game-content/source-art/rendered.terrain.grass.mown.*.png,public/game-content/source-art/rendered.terrain.concrete.paving.*.png,public/game-content/source-art/rendered.terrain.gravel.service_path.*.png,public/game-content/source-art/rendered.terrain.rock.bedrock.*.png,public/game-content/source-art/rendered.fixture.cell.toilet_sink.*.png,public/game-content/source-art/rendered.furniture.corridor.bench.variants.*.png,public/game-content/source-art/rendered.furniture.office.desk.employee.variants.*.png,public/game-content/source-art/rendered.furniture.cell.locker.variants.*.png,public/game-content/source-art/rendered.fixture.shower.head.*.png,public/game-content/source-art/rendered.fixture.cell.waste_bin.*.png,public/game-content/source-art/rendered.furniture.storage.rack.wooden.*.png,public/game-content/source-art/rendered.furniture.chair.wooden.*.png,public/game-content/source-art/rendered.furniture.dining.table.wooden.*.png,public/game-content/source-art/rendered.furniture.cell.bed.single.variants.*.png,public/game-content/source-art/rendered.furniture.medical.bed.single.*.png,public/game-content/source-art/rendered.furniture.medical.cabinet.*.png,public/game-content/source-art/rendered.furniture.kitchen.stove.*.png,public/game-content/source-art/rendered.furniture.laundry.washing_machine.twin.*.png,public/game-content/source-art/rendered.furniture.kitchen.prep_counter.*.png,public/game-content/source-art/rendered.furniture.library.bookshelf.*.png,public/game-content/source-art/rendered.furniture.security.surveillance_console.*.png,public/game-content/source-art/rendered.furniture.utility.control_panel.*.png,public/game-content/source-art/rendered.furniture.delivery.dock_gate.closed.*.png,public/game-content/source-art/rendered.furniture.kitchen.fridge.*.png,public/game-content/source-art/rendered.floor.kitchen.nonslip.*.png,public/game-content/source-art/rendered.floor.canteen.terrazzo.*.png,public/game-content/source-art/rendered.floor.yard.compacted-earth.*.png,public/game-content/source-art/rendered.floor.shower.ceramic.*.png,public/game-content/source-art/rendered.floor.laundry.nonslip.*.png,public/game-content/source-art/rendered.floor.infirmary.vinyl.*.png,public/game-content/source-art/rendered.floor.common-room.cork-rubber.*.png,public/game-content/source-art/rendered.floor.classroom.oak-laminate.*.png,public/game-content/source-art/rendered.floor.security-office.antistatic.*.png,public/game-content/source-art/rendered.floor.cell.sealed-concrete.*.png,public/game-content/source-art/rendered.floor.staff-room.woven-vinyl.*.png"
      - name: Assert the environment sheets decoded
        run: |
          set -euo pipefail
          # The per-file checks are a function because there are now two id
          # lists to run them over, and two copies of a fails-closed check are
          # how one copy quietly stops matching the other.
