          # object is drawn from a render there is one id, and a tree with none
          # is a legitimate state.
          rendered_ids="$( { grep -oE "renderedArtId: '[^']+'" src/rendering/assets/environment-sprites.ts || true; } \
                 | sed "s/renderedArtId: '//; s/'//" | sort -u)"
          [ -n "$ids$rendered_ids" ] || { echo "::error::no assetId or renderedArtId found in environment-sprites.ts; the grep needs updating"; exit 1; }
          for id in $rendered_ids; do
            file="$(ls public/game-content/source-art/rendered."$id".*.png 2>/dev/null | head -1 || true)"
            if [ -z "$file" ]; then
              echo "::error::environment-sprites.ts names rendered asset '$id' and no published render is on disk"
              exit 1
            fi
            assert_decoded "$file" "rendered.$id"
          done
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.22.0 --activate
      - name: Reject or clear a node_modules that is not a real install
        run: |
          set -uo pipefail
          if git ls-files --error-unmatch node_modules >/dev/null 2>&1; then
            echo "::error::node_modules is committed to git on this ref. It must not be: see .gitignore."
            git ls-files -s node_modules
            exit 1
          fi
          if [ -L node_modules ] || { [ -e node_modules ] && [ ! -d node_modules ]; }; then
            echo "node_modules is not a plain directory; removing it:"
            ls -ld node_modules
            rm -rf node_modules
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Provision Playwright's Chromium
        run: bash scripts/provision-playwright-browsers.sh
      - *a1
      - name: Build the production client
        run: node scripts/cloudflare-task.mjs build production
      - name: Run the built client in a browser
        run: |
          set -uo pipefail
          port="$(node -e 'const s = require("net").createServer(); s.listen(0, "127.0.0.1", () => { process.stdout.write(String(s.address().port)); s.close(); });')"
          echo "artefact preview server port: $port"
          output="$(LOCKSTATE_ARTIFACT_TEST_PORT="$port" pnpm test:artifact --workers=1 2>&1)" && status=0 || status=$?
          printf '%s\n' "$output"
          printf '%s\n' "$output" > browser-suite.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if ! printf '%s' "$output" | grep -qE '[0-9]+ passed'; then
            echo "::error::the production-artefact suite reported no passing tests"
            exit 1
          fi
          if printf '%s' "$output" | grep -qE '[0-9]+ (skipped|did not run)'; then
            echo "::error::the production-artefact suite skipped tests; running the built client is the entire point of it"
            exit 1
          fi
      - name: Upload the browser suite's failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            browser-suite.log
          retention-days: 7
          if-no-files-found: ignore
