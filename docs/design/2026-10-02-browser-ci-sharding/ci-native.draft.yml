# OWNER REVIEW DRAFT: not activated; no workflow or protection change.
name: CI
on:
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: true
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.22.0 --activate
      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(pnpm --version)" = "11.22.0"
      - name: Reject or clear a node_modules that is not a real install
        run: |
          set -uo pipefail
          if git ls-files --error-unmatch node_modules >/dev/null 2>&1; then
            echo "::error::node_modules is committed to git on this ref. It must not be: see .gitignore."
            git ls-files -s node_modules
            exit 1
          fi
          if [ -L node_modules ] || { [ -e node_modules ] && [ ! -d node_modules ]; }; then
            echo "node_modules is not a plain directory; removing it:"
            ls -ld node_modules
            rm -rf node_modules
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Hydrate Blender sources and angled frames for verification
        env:
          LFS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cleanup() {
            git config --local --unset-all 'http.https://github.com/.extraheader' 2>/dev/null || true
          }
          trap cleanup EXIT
          git config --local 'http.https://github.com/.extraheader' \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$LFS_TOKEN" | base64 -w0)"
          git lfs pull --include="assets/source/blender/*.blend,public/assets/environment/oblique/*.png" --exclude=""
      - name: Verify project
        run: pnpm verify
      - name: Verify measurement harness
        run: pnpm test:perf
      - name: Verify benchmark harness
        run: pnpm verify:benchmark
      - name: Verify Cloudflare deployment packages
        run: pnpm verify:deployment
      - name: Provision PostgreSQL and pgTAP
        run: bash scripts/provision-postgres.sh
      - name: Verify Supabase SQL (migrations + pgTAP)
        run: pnpm verify:sql
      - name: Verify generated output did not modify tracked files
        run: |
          set -uo pipefail
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Working tree is clean."
            exit 0
          fi
          echo "::error::Verification modified tracked files, or the workspace was not clean to begin with."
          echo "--- git status --porcelain ---"
          echo "$changed"
          echo "--- git diff --stat ---"
          git diff --stat || true
          echo "--- is git-lfs available in this job? ---"
          git lfs version || echo "git-lfs is NOT installed for this job"
          echo "--- what filter do the runtime atlases declare? ---"
          git check-attr filter -- public/assets/actors/actor.cook.base.idle.png || true
          exit 1
  assets:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Provision Git LFS
        run: bash scripts/provision-git-lfs.sh
      - name: Fetch runtime art from Git LFS
        env:
          LFS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cleanup() {
            git config --local --unset-all 'http.https://github.com/.extraheader' 2>/dev/null || true
          }
          trap cleanup EXIT
          git config --local 'http.https://github.com/.extraheader' \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$LFS_TOKEN" | base64 -w0)"
          git lfs pull --include="public/assets/actors,public/assets/environment/oblique/*.png"
      - name: Confirm the runtime art is image data, not LFS pointers
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          total=0
          for file in public/assets/actors/*.png; do
            count=$((count + 1))
            if head -c 64 "$file" | grep -q 'git-lfs.github.com'; then
              echo "::error::$file is still a Git LFS pointer; LFS content did not materialise"
              exit 1
            fi
            signature="$(head -c 8 "$file" | od -An -tx1 | tr -d ' \n')"
            if [ "$signature" != "89504e470d0a1a0a" ]; then
              echo "::error::$file does not start with the PNG signature (got $signature)"
              exit 1
            fi
            size="$(stat -c%s "$file")"
            # An LFS pointer is ~130 bytes. Any real atlas is orders of magnitude
            # larger; this is a floor, not a pinned size, so re-rendered art does
            # not have to update CI.
            if [ "$size" -lt 4096 ]; then
              echo "::error::$file is only $size bytes, too small to be a real atlas"
              exit 1
            fi
            total=$((total + size))
            printf '%10s bytes  %s\n' "$size" "$file"
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::no runtime atlases were found to validate"
            exit 1
          fi
          echo "OK: $count atlases, $total bytes of real image data"
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.22.0 --activate
      - name: Validate runtime atlases against the authored contract
        run: pnpm verify:assets
  browser:
    name: browser
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - browser-source
      - browser-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require both source shards and artifact success on the exact workflow subject
        env:
          SOURCE_RESULT: ${{ needs.browser-source.result }}
          ARTIFACT_RESULT: ${{ needs.browser-artifact.result }}
          SOURCE_SHA: ${{ needs.browser-source.outputs.tested_sha }}
          ARTIFACT_SHA: ${{ needs.browser-artifact.outputs.tested_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          test "$ARTIFACT_RESULT" = success
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$ARTIFACT_SHA" = "$GITHUB_SHA"
  browser-source:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
    outputs:
      tested_sha: ${{ steps.subject.outputs.sha }}
    steps:
